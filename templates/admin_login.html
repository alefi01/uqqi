<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — {{ company.title }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#0e0d0b; --surface:#1a1915; --border:#2e2c27; --accent:#c8a96e; --text:#e8e4db; --muted:#7a7568; --err:#eb5757; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }

    .login-box { width:100%; max-width:380px; }
    .login-box__name { font-size:.75rem; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); margin-bottom:.5rem; }
    .login-box__title { font-size:1.5rem; font-weight:600; margin-bottom:2rem; }

    .field { margin-bottom:1rem; }
    .field label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:.4rem; }
    .field input {
      width:100%; padding:.7rem 1rem; border-radius:8px;
      background:var(--surface); border:1px solid var(--border);
      color:var(--text); font-size:1rem; font-family:inherit;
      transition:border-color .2s;
    }
    .field input:focus { outline:none; border-color:var(--accent); }

    .error { background:#1f0e0e; border:1px solid #3d1515; color:var(--err); padding:.65rem 1rem; border-radius:8px; font-size:.85rem; margin-bottom:1rem; }

    .btn { width:100%; padding:.75rem; border-radius:8px; background:var(--accent); color:#0e0d0b; font-size:.95rem; font-weight:600; font-family:inherit; border:none; cursor:pointer; transition:opacity .2s; }
    .btn:hover { opacity:.85; }

    .view-site { display:block; text-align:center; margin-top:1.25rem; font-size:.82rem; color:var(--muted); text-decoration:none; }
    .view-site:hover { color:var(--text); }
  </style>
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <link rel="shortcut icon" href="/static/favicon.ico">
</head>
<body>
  <div class="login-box">
    <p class="login-box__name">{{ company.title }}</p>
    <h1 class="login-box__title">Панель управления</h1>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/login">
      <input type="hidden" name="slug" value="{{ company.slug }}">
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autofocus autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Войти</button>
    </form>

    <a href="/" class="view-site">← Посмотреть сайт</a>
  </div>
</body>
</html>
