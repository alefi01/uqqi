{% if unpaid_overlay %}
<style>
  #uqqi-unpaid-overlay{
    position:fixed;inset:0;z-index:99999;display:none;
    align-items:center;justify-content:center;
    background:rgba(20,18,16,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    animation:uqqiFade .5s ease;
  }
  #uqqi-unpaid-overlay.show{display:flex;}
  @keyframes uqqiFade{from{opacity:0}to{opacity:1}}
  .uqqi-unpaid-box{
    background:#fff;border-radius:20px;padding:2.4rem 2rem;max-width:380px;width:90%;
    text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .uqqi-unpaid-box .seal{width:56px;height:56px;margin:0 auto 1.2rem;display:block}
  .uqqi-unpaid-box h3{font-size:1.3rem;font-weight:700;color:#1A1714;margin:0 0 .6rem}
  .uqqi-unpaid-box p{font-size:.92rem;color:#6b6258;line-height:1.6;margin:0 0 1.5rem}
  .uqqi-unpaid-box a{
    display:inline-block;background:#C8643C;color:#fff;text-decoration:none;
    font-weight:600;font-size:.95rem;padding:.8rem 1.8rem;border-radius:12px;transition:opacity .2s;
  }
  .uqqi-unpaid-box a:hover{opacity:.9}
</style>
<div id="uqqi-unpaid-overlay">
  <div class="uqqi-unpaid-box">
    <img class="seal" src="/static/logo-seal.png" alt="uqqi">
    <h3>Сайт не оплачен</h3>
    <p>Если вы владелец этого сайта — оплатите подписку в личном кабинете, чтобы он оставался доступным для ваших клиентов.</p>
    <a href="https://lk.uqqi.ru/">Перейти в кабинет</a>
  </div>
</div>
<script>
  // Показываем напоминание через несколько секунд после захода
  setTimeout(function(){
    var ov = document.getElementById('uqqi-unpaid-overlay');
    if (ov) ov.classList.add('show');
  }, 4000);
</script>
{% endif %}
