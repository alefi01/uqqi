# /etc/nginx/sites-available/uqqi.ru
#
# Установка:
#   sudo cp uqqi.nginx.conf /etc/nginx/sites-available/uqqi.ru
#   sudo ln -s /etc/nginx/sites-available/uqqi.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (wildcard через certbot + DNS challenge):
#   sudo certbot certonly --manual --preferred-challenges dns \
#        -d uqqi.ru -d *.uqqi.ru
#
# После получения сертификата раскомментируйте блок SSL ниже.

# ── Rate limiting (edge-защита от флуда/DoS; частичная замена CDN) ─────────────
# Файл включается внутри http{} основного nginx.conf → директивы зон валидны здесь.
# $binary_remote_addr — реальный IP клиента (перед nginx НЕТ прокси/CDN).
# Если впереди появится прокси/CDN — подключить ngx_http_realip_module
# (set_real_ip_from ...), иначе лимит будет считаться по IP прокси, а не клиента.
limit_req_zone  $binary_remote_addr zone=uqqi_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=uqqi_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Редирект HTTP → HTTPS
server {
    listen 80;
    server_name uqqi.ru *.uqqi.ru;
    return 301 https://$host$request_uri;
}

# Основной HTTPS-сервер (обслуживает и основной домен, и все субдомены)
server {
    listen 443 ssl http2;
    server_name uqqi.ru *.uqqi.ru;

    # SSL-сертификаты (wildcard от certbot)
    ssl_certificate     /etc/letsencrypt/live/uqqi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uqqi.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Загрузки клиентов (отдаём напрямую через nginx, не через Python)
    location /static/uploads/ {
        alias /var/www/uqqi/static/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Остальные статические файлы
    location /static/ {
        alias /var/www/uqqi/static/;
        expires 7d;
    }

    # Всё остальное → FastAPI (uvicorn на 127.0.0.1:8000)
    location / {
        # Edge-лимит: ~30 запросов/с с одного IP (всплеск до 60 без задержки),
        # не более 30 одновременных соединений. Останавливает флуд, не мешает
        # обычным посетителям. Статика (/static/*) — отдельные location без лимита.
        limit_req  zone=uqqi_req burst=60 nodelay;
        limit_conn uqqi_conn 30;

        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Лимит на загрузку файлов (должен совпадать с MAX_PHOTO_SIZE в app)
        client_max_body_size 6M;

        # Увеличенный таймаут для парсера (может работать долго)
        proxy_read_timeout    600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
    }
}
