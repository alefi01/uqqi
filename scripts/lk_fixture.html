<!DOCTYPE html>

  Кабинет — SPA на React: без бэкенда он показывает экран входа, поэтому
  здесь подставлены ответы /lk/api (те же поля, что отдаёт app/cabinet.py).
  Запуск:  python3 -m http.server 8899  →  /scripts/lk_fixture.html
  Ключи:   ?empty=1 — ни одного сайта, ?anon=1 — гость (экран входа),
           ?trial=1 — окно «Пробный Pro закончился».
  Снимки для гейтов: node scripts/snapshot_lk.mjs
-->

<body>

<script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js"></script>
<script>

  {key:"atelier",name:"Atelier",tier:"pro",vibe:"Светлая мастерская, нумерованный прайс",fit:"ремонт обуви, ключи, ателье",preview:"",poster:""},
  {key:"barber",name:"Barber",tier:"pro",vibe:"Тёмный кинематографичный, латунь",fit:"барбершопы, парикмахерские",preview:"",poster:""},
  {key:"bloom",name:"Bloom",tier:"pro",vibe:"Мягкий светлый, скруглённые карточки",fit:"маникюр, косметологи, массаж",preview:"",poster:""},
  {key:"bouquet",name:"Bouquet",tier:"pro",vibe:"Журнальный, крупные фото и антиква",fit:"цветочные, декор, подарки",preview:"",poster:""},
];
const ROUTES = {
  '/me': {email:"maksim@example.ru"},
  '/sites': {sites:SITES, canAdd:true, canAddReason:""},
  '/designs': {designs:DESIGNS},
  '/telegram': {connected:false, link:"https://t.me/uqqi_bot?start=abc"},

const Q = new URLSearchParams(location.search);
if (Q.has('empty')) ROUTES['/sites'] = {sites:[], canAdd:true, canAddReason:""};
// ?limit=1 — сайт давно собран, но добавить ещё нельзя: показываем причину с бэкенда.
if (Q.has('limit')) ROUTES['/sites'] = {sites:[SITES[0]], canAdd:false,
  canAddReason:"Бесплатно — один сайт. Чтобы добавить ещё, оформите Pro на своём сайте."};
// ?trial=1 — у второго сайта закончился Pro-триал: показывается окно «Пробный Pro закончился».
if (Q.has('trial')) Object.assign(SITES[1], {trialEnded:true, trialEndedAt:"01.09.2026"});
window.fetch = function(url, opts){
  const path = String(url).replace('/lk/api','');
  if (Q.has('anon') && path === '/me')
    return Promise.resolve({ok:false, status:401, json:()=>Promise.resolve({detail:'no'})});
  const body = ROUTES[path] || {};
  return Promise.resolve({ok:true, status:200, json:()=>Promise.resolve(body)});
};
</script>
<script src="/static/lk/api.js"></script>
<script type="text/babel" src="/static/lk/app.bundle.jsx"></script>
</body>
